<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Offline — Hazri</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a12" />
    <style>
      html, body { margin: 0; padding: 0; background: #0a0a12; color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
      .card { max-width: 22rem; text-align: center; }
      .badge { width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 16px; background: linear-gradient(135deg, #4f46e5, #a855f7); display: grid; place-items: center; font-weight: 700; font-size: 1.5rem; color: white; }
      h1 { font-size: 1.125rem; margin: 0 0 .5rem; font-weight: 600; letter-spacing: -0.01em; }
      p { color: #a1a1aa; font-size: .875rem; line-height: 1.5; margin: 0 0 1.25rem; }
      button { background: white; color: #0a0a12; border: 0; padding: .625rem 1rem; border-radius: 999px; font-weight: 600; font-size: .875rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">H</div>
      <h1>You're offline</h1>
      <p>This page isn't cached yet. Reconnect and try again — your saved data is safe on this device.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
